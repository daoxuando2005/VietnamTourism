openapi: 3.0.3
info:
  title: VietnamTourism Profile API
  version: 1.1.0
  description: >-
    Public profile reads, verified JWT owner bootstrap/read and database-backed admin access. Persistence and migration
    roles are independent.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/profiles/{username}:
    get:
      operationId: getPublicProfile
      summary: Read an active public profile
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-z0-9_]{3,40}$
      responses:
        '200':
          description: Public profile; never contact data, role or account status
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/profiles/id/{id}:
    get:
      operationId: getPublicProfileById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Public profile; never contact data, role or account status
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/me/profile:
    get:
      operationId: getOwnProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: bootstrapProfile
      description: Idempotent for the verified subject; role/id are not accepted from the client.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/access:
    get:
      operationId: checkAdminAccess
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestId:
      description: Generated by the edge gateway; forwarded unchanged inside the service boundary
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$|^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$
  responses:
    BadRequest:
      description: Invalid parameters (INVALID_ARGUMENT)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Profile absent or hidden (PROFILE_NOT_FOUND)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Too many requests (RATE_LIMITED)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      description: Unexpected server error (INTERNAL_ERROR); no stack traces or SQL
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unavailable:
      description: Dependency unavailable or timed out (DEPENDENCY_UNAVAILABLE)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthenticated:
      description: Missing, invalid or expired token (UNAUTHENTICATED)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Insufficient permission or blocked account (FORBIDDEN/ACCOUNT_BLOCKED)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Username already used (USERNAME_TAKEN)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    PublicProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - displayName
        - bio
        - avatarUrl
        - coverUrl
        - website
        - location
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          pattern: ^[a-z0-9_]{3,40}$
        displayName:
          type: string
          maxLength: 100
        bio:
          type: string
          nullable: true
          maxLength: 1000
        avatarUrl:
          type: string
          nullable: true
          maxLength: 2048
        coverUrl:
          type: string
          nullable: true
          maxLength: 2048
        website:
          type: string
          nullable: true
          maxLength: 2048
        location:
          type: string
          nullable: true
          maxLength: 200
        createdAt:
          type: string
          format: date-time
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
        - timestamp
        - errors
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
    OwnProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - displayName
        - bio
        - avatarUrl
        - coverUrl
        - website
        - location
        - createdAt
        - birthDate
        - phoneNumber
        - role
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          pattern: ^[a-z0-9_]{3,40}$
        displayName:
          type: string
          maxLength: 100
        bio:
          type: string
          nullable: true
          maxLength: 1000
        avatarUrl:
          type: string
          nullable: true
          maxLength: 2048
        coverUrl:
          type: string
          nullable: true
          maxLength: 2048
        website:
          type: string
          nullable: true
          maxLength: 2048
        location:
          type: string
          nullable: true
          maxLength: 200
        createdAt:
          type: string
          format: date-time
        birthDate:
          type: string
          format: date
          nullable: true
        phoneNumber:
          type: string
          nullable: true
          maxLength: 30
        role:
          type: string
          enum:
            - MEMBER
            - ADMIN
    BootstrapRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - displayName
      properties:
        username:
          type: string
          pattern: ^[a-z0-9_]{3,40}$
        displayName:
          type: string
          minLength: 1
          maxLength: 100
    AdminAccess:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - ADMIN
