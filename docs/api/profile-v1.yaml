openapi: 3.0.3
info:
  title: VietnamTourism Profile API
  version: 1.0.0
  description: Public read contract. P0-04 returns 503 until the P0-05 database is configured. Authenticated profile operations are deferred to P0-06/P0-07.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/profiles/{username}:
    get:
      operationId: getPublicProfile
      summary: Read an active public profile
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9_]{3,40}$'
      responses:
        '200':
          description: Public profile; never contact data, role or account status
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestId:
      description: Generated by the edge gateway; forwarded unchanged inside the service boundary
      schema:
        type: string
        pattern: '^[a-f0-9]{32}$|^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$'
  responses:
    BadRequest:
      description: Invalid parameters (INVALID_ARGUMENT)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Profile absent or hidden (PROFILE_NOT_FOUND)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Too many requests (RATE_LIMITED)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      description: Unexpected server error (INTERNAL_ERROR); no stack traces or SQL
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unavailable:
      description: Dependency unavailable or timed out (DEPENDENCY_UNAVAILABLE)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    PublicProfile:
      type: object
      additionalProperties: false
      required: [id, username, displayName, bio, avatarUrl, coverUrl, website, location, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          pattern: '^[a-z0-9_]{3,40}$'
        displayName:
          type: string
          maxLength: 100
        bio:
          type: string
          nullable: true
          maxLength: 1000
        avatarUrl:
          type: string
          nullable: true
          maxLength: 2048
        coverUrl:
          type: string
          nullable: true
          maxLength: 2048
        website:
          type: string
          nullable: true
          maxLength: 2048
        location:
          type: string
          nullable: true
          maxLength: 200
        createdAt:
          type: string
          format: date-time
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, requestId, timestamp, errors]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
