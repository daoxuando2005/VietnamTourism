name: Foundation CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run lint
      - run: npm run check:contract
      - run: npm run generate:api
      - run: git diff --exit-code -- src/api/generated
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:legacy-db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-migration-report
          path: docs/verification/evidence/P0-02-legacy-db.txt
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-build-placeholder
  profile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/profile-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: bash ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-test-reports
          path: services/profile-service/target/surefire-reports/
  gateway:
    runs-on: ubuntu-latest
    needs: [frontend, profile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: docker compose -f infra/gateway/compose.smoke.yaml -p vt-p0-04 build
      - run: npm run test:gateway
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-smoke-report
          path: docs/verification/evidence/P0-04-gateway.txt
  stack:
    runs-on: ubuntu-latest
    needs: [frontend, profile]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p .tools && npm run test:stack > .tools/stack.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-test-report
          path: .tools/stack.log
