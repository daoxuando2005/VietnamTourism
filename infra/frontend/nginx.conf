pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  resolver 127.0.0.11 valid=2s ipv6=off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    set $gateway_upstream gateway:8080;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { default_type application/json; return 200 '{"status":"UP"}'; }
    location /api/ {
      proxy_pass http://$gateway_upstream;
      proxy_set_header Host $host;
      proxy_connect_timeout 2s;
      proxy_read_timeout 8s;
    }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { add_header Cache-Control no-store; try_files $uri $uri/ /index.html; }
  }
}
