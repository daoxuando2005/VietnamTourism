pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/json;
  resolver 127.0.0.11 valid=2s ipv6=off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  log_format request_json escape=json '{"requestId":"$request_id","method":"$request_method","status":$status,"duration":$request_time}';
  access_log /dev/stdout request_json;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  server {
    listen 8080;
    set $profile_upstream profile-service:8081;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    add_header X-Request-ID $request_id always;
    add_header Cache-Control no-store always;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Do not forward client-provided identity headers as an authorization source.
    proxy_set_header X-User-ID "";
    proxy_set_header X-Role "";
    proxy_hide_header X-Request-ID;
    proxy_hide_header Cache-Control;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    proxy_next_upstream off;
    limit_req_status 429;
    error_page 400 = @bad_request;
    error_page 404 = @not_found;
    error_page 413 = @too_large;
    error_page 429 = @rate_limited;
    error_page 502 504 = @unavailable;
    location = /health/live { return 200 '{"status":"UP"}'; }
    location = /health/ready { proxy_pass http://$profile_upstream/q/health/ready; }
    location /api/v1/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://$profile_upstream;
    }
    location / { return 404; }
    location @bad_request { return 400 '{"code":"INVALID_ARGUMENT","message":"Yêu cầu không hợp lệ.","requestId":"$request_id","timestamp":"$time_iso8601","errors":[]}'; }
    location @not_found { return 404 '{"code":"NOT_FOUND","message":"Không tìm thấy API.","requestId":"$request_id","timestamp":"$time_iso8601","errors":[]}'; }
    location @too_large { return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"Yêu cầu quá lớn.","requestId":"$request_id","timestamp":"$time_iso8601","errors":[]}'; }
    location @rate_limited { return 429 '{"code":"RATE_LIMITED","message":"Vui lòng thử lại sau.","requestId":"$request_id","timestamp":"$time_iso8601","errors":[]}'; }
    location @unavailable { return 503 '{"code":"DEPENDENCY_UNAVAILABLE","message":"Dịch vụ tạm thời không sẵn sàng.","requestId":"$request_id","timestamp":"$time_iso8601","errors":[]}'; }
  }
}
