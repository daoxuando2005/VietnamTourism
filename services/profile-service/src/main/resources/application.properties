quarkus.application.name=profile-service
quarkus.http.host=0.0.0.0
quarkus.http.port=8081
quarkus.http.limits.max-body-size=1M
quarkus.http.read-timeout=10s
quarkus.http.idle-timeout=30s
quarkus.log.console.format=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5p [%c] requestId=%X{requestId} %s%e%n
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.active=${PROFILE_PERSISTENCE_ENABLED:false}
quarkus.datasource.jdbc.url=${PROFILE_JDBC_URL:jdbc:postgresql://localhost:5432/profile}
quarkus.datasource.username=${PROFILE_DB_USER:profile_runtime}
quarkus.datasource.password=${PROFILE_DB_PASSWORD:}
quarkus.datasource.jdbc.acquisition-timeout=3s
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.additional-jdbc-properties."options"=-c statement_timeout=5000
quarkus.hibernate-orm.active=${PROFILE_PERSISTENCE_ENABLED:false}
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=false
quarkus.transaction-manager.default-transaction-timeout=5s
quarkus.smallrye-openapi.info-title=VietnamTourism Profile API
quarkus.smallrye-openapi.info-version=1.1.0
quarkus.http.auth.proactive=false
quarkus.jackson.fail-on-unknown-properties=true
mp.jwt.verify.issuer=${SUPABASE_JWT_ISSUER:urn:unconfigured}
mp.jwt.verify.audiences=${SUPABASE_JWT_AUDIENCE:authenticated}
mp.jwt.verify.publickey.location=${SUPABASE_JWKS_URL:unconfigured-jwks.json}
mp.jwt.verify.publickey.algorithm=${SUPABASE_JWT_ALGORITHM:ES256}
mp.jwt.verify.clock.skew=5
smallrye.jwt.required.claims=sub,iss,aud,exp,iat
smallrye.jwt.jwks.refresh-interval=10
smallrye.jwt.jwks.forced-refresh-interval=1
